<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #475569;
    --border: #e2e8f0;
    --accent: #1d4ed8;
    --shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.75;
    font-size: 16.5px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  header, main, footer {
    width: min(1180px, calc(100% - 40px));
    margin-left: auto;
    margin-right: auto;
  }

  header {
    padding: 22px 0 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }

  .title { text-decoration: none; border: 0; color: inherit; }
  .title h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 750;
    letter-spacing: -0.01em;
  }

  nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  nav a {
    display: inline-flex;
    align-items: center;
    height: 30px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid transparent;
    color: var(--muted);
    text-decoration: none;
    font-weight: 650;
    font-size: 13px;
  }
  nav a:hover {
    background: rgba(29, 78, 216, 0.08);
    border-color: rgba(29, 78, 216, 0.18);
    color: var(--accent);
    text-decoration: none;
  }

  main {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 28px;
    margin: 0 auto 46px;
  }

  /* Keep long-form reading comfortable */
  main > :not(.home-wrap) {
    max-width: 78ch;
    margin-left: auto;
    margin-right: auto;
  }

  h1, h2, h3, h4, h5, h6, strong, b { color: var(--ink); }
  h1 { line-height: 1.25; margin-top: 0; }
  h2 { margin-top: 28px; }

  a { color: var(--accent); }

  /* Theme uses a custom <content> element */
  content { display: block; line-height: 1.8; }
  content p { margin: 0 0 14px; }
  content ul, content ol { margin: 0 0 16px; padding-left: 22px; }
  content li { margin: 6px 0; }

  img { max-width: 100%; height: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid var(--border); padding: 10px; }

  code {
    padding: 2px 6px;
    border-radius: 6px;
    background: rgba(15, 23, 42, 0.06);
  }

  pre code {
    display: block;
    padding: 16px;
    border-radius: 12px;
    white-space: pre;
    overflow-x: auto;
    font-size: 13.5px;
    background: rgba(15, 23, 42, 0.06);
  }

  blockquote {
    margin: 16px 0;
    padding: 12px 16px;
    border-left: 3px solid rgba(29, 78, 216, 0.5);
    background: rgba(29, 78, 216, 0.06);
    border-radius: 10px;
    color: var(--muted);
  }

  footer {
    padding: 18px 0 34px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* Blog list */
  ul.blog-posts { list-style: none; padding: 0; margin: 0; }
  ul.blog-posts li {
    display: flex;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(226, 232, 240, 0.7);
  }
  ul.blog-posts li span { flex: 0 0 130px; color: var(--muted); font-size: 13px; }

  @media (max-width: 900px) {
    header, main, footer { width: calc(100% - 28px); }
    header { flex-direction: column; align-items: flex-start; }
    nav { justify-content: flex-start; }
    main { padding: 18px; }
    main > :not(.home-wrap) { max-width: none; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020;
      --card: #0f172a;
      --ink: #e5e7eb;
      --muted: #a8b3cf;
      --border: rgba(148, 163, 184, 0.25);
      --accent: #93c5fd;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    code, pre code { background: rgba(226, 232, 240, 0.08); }
    blockquote { background: rgba(147, 197, 253, 0.10); }
    nav a:hover { background: rgba(147, 197, 253, 0.10); border-color: rgba(147, 197, 253, 0.20); }
  }
</style>
