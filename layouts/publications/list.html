<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ .Title }}</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Merriweather', Georgia, 'Times New Roman', serif;max-width:900px;margin:28px auto;color:#111;line-height:1.5;padding:0 18px;background:#fafafa}
    a{color:#0b66c3}
    main{background:#fff;padding:28px;border-radius:6px;box-shadow:0 8px 28px rgba(16,24,40,0.06)}
    h1{margin-top:0}
    .pubs{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Roboto Mono, monospace;font-size:14px}
    .pubs ul{margin:0;padding-left:1.1rem}
    .pubs li{margin:6px 0;text-indent:-1.1rem;padding-left:1.1rem}
    @media print{body{background:#fff;color:#000}main{box-shadow:none;padding:12px}}
  </style>
</head>
<body>
  <main>
    <h1>{{ .Title }}</h1>
    <div class="pubs">
      {{ .Content }}
    </div>
    <p><a href="/">Back</a></p>
  </main>
</body>
</html>
